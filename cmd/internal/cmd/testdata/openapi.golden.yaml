        target-reference:
          allOf:
          - $ref: "#/components/schemas/TypedMapping"
          description: target-reference identifies the artifact being mapped to; must match a mapping-reference id
        title:
          description: title describes the purpose of this mapping document at a glance
          type: string
      required:
      - title
      - metadata
      - source-reference
      - target-reference
      - mappings
      type: object
      x-status: experimental
    MappingReference:
      description: MappingReference represents a reference to an external document with full metadata.
      properties:
        description:
          description: description is prose regarding the artifact's purpose or content
          type: string
        id:
          description: |-
            id identifies this mapping reference within the artifact and, when url
